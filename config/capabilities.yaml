# Confidence scoring parameters
confidence_scoring:
  # Base confidence for different evidence types
  evidence_types:
    direct_funding: 0.95
    press_release: 0.85
    news_article: 0.75
    patent_filing: 0.80
    sec_filing: 0.90
    company_website: 0.70
    industry_report: 0.65
  
  # Multipliers for evidence strength
  multipliers:
    multiple_sources: 1.2
    recent_evidence: 1.1
    specific_technical_details: 1.3
    funding_amount_large: 1.2
    patent_granted: 1.1
    industry_recognition: 1.15
  
  # Thresholds
  thresholds:
    high_confidence: 0.8
    medium_confidence: 0.6
    low_confidence: 0.4
    review_threshold: 0.7  # Items below this go to review queue

# Entity resolution parameters
entity_resolution:
  # Fuzzy matching thresholds
  fuzzy_thresholds:
    exact_match: 1.0
    high_confidence: 0.9
    medium_confidence: 0.8
    low_confidence: 0.7
  
  # Name normalization rules
  normalization:
    remove_corporate_suffixes: true
    corporate_suffixes:
      - "Inc."
      - "Inc"
      - "Corporation"
      - "Corp."
      - "Corp"
      - "LLC"
      - "Ltd."
      - "Ltd"
      - "Limited"
      - "Company"
      - "Co."
      - "Co"
    
    remove_common_words: true
    common_words:
      - "The"
      - "A"
      - "An"
      - "And"
      - "Or"
      - "Of"
      - "In"
      - "On"
      - "At"
      - "To"
      - "For"
      - "With"
      - "By"
    
    normalize_case: true
    remove_punctuation: true
  
  # Relationship detection
  relationships:
    parent_subsidiary_keywords:
      - "subsidiary"
      - "parent company"
      - "wholly owned"
      - "majority owned"
      - "acquired"
      - "merger"
    
    consortium_keywords:
      - "consortium"
      - "partnership"
      - "collaboration"
      - "joint venture"
      - "alliance"
      - "cooperation"
    
    partner_keywords:
      - "partner"
      - "collaboration"
      - "agreement"
      - "contract"
      - "supply"
      - "customer"
