# Capability Area Definitions
# Maps semiconductor capabilities to keywords, patterns, and confidence scoring

capabilities:
  1:  # 3D Packaging
    name: "3D Packaging"
    description: "3D packaging, chiplets, HBM, advanced interconnects"
    keywords:
      primary:
        - "3D packaging"
        - "chiplet"
        - "HBM"
        - "high bandwidth memory"
        - "advanced packaging"
        - "heterogeneous integration"
        - "system in package"
        - "SIP"
        - "fan-out"
        - "fan-in"
        - "through-silicon via"
        - "TSV"
        - "interposer"
        - "bump"
        - "flip-chip"
      secondary:
        - "packaging"
        - "assembly"
        - "interconnect"
        - "bonding"
        - "substrate"
        - "thermal management"
        - "power delivery"
    patterns:
      - "3D.*packag"
      - "chiplet.*integrat"
      - "HBM.*memor"
      - "TSV.*via"
      - "fan.out.*packag"
      - "system.*package"
    confidence_weights:
      primary_keyword: 0.9
      secondary_keyword: 0.6
      pattern_match: 0.8
      funding_context: 0.7
      patent_context: 0.8

